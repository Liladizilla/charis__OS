name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Boot Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            nasm \
            qemu-system-x86 \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            ovmf

      - name: Build kernel and boot images
        run: make images

      - name: Compile VMM self-tests
        run: make test

      - name: Inspect kernel ELF
        run: |
          file build/kernel.elf
          objdump -f build/kernel.elf | sed -n '1,6p'

      - name: Confirm ISO payload
        run: |
          test -f build/charisos-vm.iso
          test -f build/charisos-usb.img
          ls -la build/charisos-vm.iso build/charisos-usb.img

      - name: Boot matrix (CD/disk x BIOS/UEFI)
        # The assertions live in tools/verify-boot.sh so CI and local runs use
        # identical logic. See that file for why the boot banner is not a
        # sufficient signal: it is printed before the Multiboot2 magic is
        # validated, and GRUB suppresses its own output without a TTY.
        run: |
          set -e
          # OVMF lives in a different place on Fedora, Debian and Ubuntu, and
          # some builds only ship the 4M variant. Resolve it rather than
          # hardcoding one path, otherwise the UEFI half silently skips.
          OVMF=""
          for c in \
              /usr/share/OVMF/OVMF_CODE_4M.fd \
              /usr/share/OVMF/OVMF_CODE.fd \
              /usr/share/edk2/ovmf/OVMF_CODE.fd \
              /usr/share/edk2-ovmf/OVMF_CODE.fd \
              /usr/share/qemu/OVMF.fd ; do
            if [ -f "$c" ]; then OVMF="$c"; break; fi
          done
          if [ -z "$OVMF" ]; then
            echo "::warning::no OVMF firmware found; UEFI boot checks skipped"
          else
            echo "Using OVMF: $OVMF"
            export OVMF
            ./tools/verify-boot.sh build/charisos-vm.iso
            ./tools/verify-boot.sh build/charisos-usb.img --disk
            ./tools/verify-boot.sh build/charisos-vm.iso --uefi
            ./tools/verify-boot.sh build/charisos-usb.img --disk --uefi
          fi

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs
          path: build/verify-*.log
          retention-days: 14

      - name: Publish ISO artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: charisos-images
          path: |
            build/charisos-vm.iso
            build/charisos-usb.img
          retention-days: 30
