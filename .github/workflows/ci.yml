name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Avoid wasting runners on superseded commits from the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Boot & Ring-3 Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 18
        run: |
          # Keep dependency setup bounded; firmware is optional because BIOS
          # boot is the gating path and graphical capture uses SeaBIOS.
          # Hosted Ubuntu runners may list an Azure HTTP mirror first; it has
          # repeatedly stalled DNS/HTTP access while the official HTTPS archive
          # was reachable. Pin this ephemeral mirror list to the working archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          timeout 420s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          timeout 780s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends \
            build-essential \
            nasm \
            qemu-system-x86 \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            dosfstools

      - name: Verify build toolchain
        run: make check-tools

      - name: Build kernel and boot images
        run: make images

      - name: Verify x86-64 baseline instruction set
        run: |
          if objdump -d -Mintel build/kernel.elf | grep -Eiq '[[:space:]](shlx|shrx|sarx|mulx|bzhi|pdep|pext|rorx|andn|bextr|blsi|blsr|blsmsk|tzcnt|lzcnt|popcnt|crc32|adcx|adox)[[:space:]]'; then
            echo "ERROR: compiler emitted BMI/other non-baseline instructions"
            objdump -d -Mintel build/kernel.elf | grep -Ei '[[:space:]](shlx|shrx|sarx|mulx|bzhi|pdep|pext|rorx|andn|bextr|blsi|blsr|blsmsk|tzcnt|lzcnt|popcnt|crc32|adcx|adox)[[:space:]]'
            exit 1
          fi
          echo "PASS: generated kernel code uses the x86-64 baseline ISA"

      - name: Upload kernel debug symbols and objects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charisos-kernel-debug
          path: |
            build/kernel.elf
            build/pmm.o
            build/memory.o
            build/main.o
            build/serial.o
          if-no-files-found: warn
          retention-days: 14

      - name: Test browser HTML text extraction
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Iinclude tests/browser_html_test.c -Wl,--gc-sections -o /tmp/browser_html_test
          /tmp/browser_html_test

      - name: Test RTC register decoding and wall-clock calendar conversion
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Iinclude tests/rtc_decode_test.c kernel/rtc.c -Wl,--gc-sections -o /tmp/rtc_decode_test
          /tmp/rtc_decode_test

      - name: Test DHCP packet identity and lease option validation
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Iinclude tests/dhcp_packet_test.c kernel/dhcp.c -Wl,--gc-sections -o /tmp/dhcp_packet_test
          /tmp/dhcp_packet_test

      - name: Test window manager lifecycle and bounds
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Iinclude tests/wm_lifecycle_test.c -Wl,--gc-sections -o /tmp/wm_lifecycle_test
          /tmp/wm_lifecycle_test

      - name: Test capability conjunction and grant sanitization
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Iinclude tests/security_caps_test.c kernel/security.c -Wl,--gc-sections -o /tmp/security_caps_test
          /tmp/security_caps_test
      - name: Test monotonic task PID allocation
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -Iinclude tests/task_pid_test.c -o /tmp/task_pid_test
          /tmp/task_pid_test

      - name: Test concurrent task PID uniqueness
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -pthread -Iinclude tests/task_pid_concurrency_test.c -o /tmp/task_pid_concurrency_test
          /tmp/task_pid_concurrency_test

      - name: Test VFS descriptor rights and lifecycle
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -pthread -ffunction-sections -fdata-sections -Iinclude tests/fd_table_test.c kernel/vfs.c -Wl,--gc-sections -o /tmp/fd_table_test
          /tmp/fd_table_test

      - name: Test syscall read destination preflight
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Iinclude tests/syscall_read_preflight_test.c -Wl,--gc-sections -o /tmp/syscall_read_preflight_test
          /tmp/syscall_read_preflight_test

      - name: Test IL loader VFS ownership and bounds
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Iinclude tests/il_loader_test.c -Wl,--gc-sections -o /tmp/il_loader_test
          /tmp/il_loader_test

      - name: Test ELF exact-read bounds
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Iinclude tests/elf_fd_read_test.c -Wl,--gc-sections -o /tmp/elf_fd_read_test
          /tmp/elf_fd_read_test

      - name: Test FAT32 VFS offset narrowing
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Iinclude tests/vfs_fat32_offset_test.c -Wl,--gc-sections -o /tmp/vfs_fat32_offset_test
          /tmp/vfs_fat32_offset_test

      - name: Test exec address-space replacement transaction
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Iinclude tests/syscall_exec_transaction_test.c -Wl,--gc-sections -o /tmp/syscall_exec_transaction_test
          /tmp/syscall_exec_transaction_test

      - name: Build ELF smoke-test disk
        run: make elf-test

      - name: Compile VMM self-tests
        run: make test

      - name: Inspect kernel ELF
        run: |
          file build/kernel.elf
          objdump -f build/kernel.elf | sed -n '1,6p'

      - name: Confirm ISO payload
        run: |
          test -f build/charisos-vm.iso
          test -f build/charisos-usb.img
          ls -la build/charisos-vm.iso build/charisos-usb.img

      - name: BIOS boot, ring-3 and ELF execution checks
        # Verify ring-3 syscall/yield/resume and load a static ELF from FAT32.
        # BIOS checks run even when OVMF is absent.
        run: |
          set -e
          ./tools/verify-boot.sh build/charisos-vm.iso
          ./tools/verify-boot.sh build/charisos-usb.img --disk
          ./tools/verify-boot.sh build/charisos-vm.iso \
            --elf-test-disk build/elf-smoke-disk.img

      - name: Authorized ELF exec boots in a fresh address space
        run: |
          set -e
          make images-elf-exec-test
          ./tools/verify-boot.sh build/elf-exec-test/charisos-vm.iso \
            --elf-test-disk build/elf-smoke-disk.img --expect-elf-exec

          # UEFI checks are firmware-dependent and remain advisory on CI.
          # OVMF ships in two shapes and lives in different places across
          # Fedora, Debian and Ubuntu. Prefer the classic 2MB CODE image, which
          # works with -bios; the 4M split builds are handled by
          # tools/verify-boot.sh via pflash. Hardcoding one path made half the
          # boot matrix silently skip, and picking the 4M build first made
          # QEMU fail with "could not load PC BIOS".
          OVMF=""
          for c in \
              /usr/share/OVMF/OVMF_CODE.fd \
              /usr/share/edk2/ovmf/OVMF_CODE.fd \
              /usr/share/edk2-ovmf/OVMF_CODE.fd \
              /usr/share/qemu/OVMF.fd \
              /usr/share/OVMF/OVMF_CODE_4M.fd ; do
            if [ -f "$c" ]; then OVMF="$c"; break; fi
          done
          if [ -z "$OVMF" ]; then
            echo "::warning::no OVMF firmware found; UEFI boot checks skipped"
          else
            echo "Using OVMF: $OVMF"
            export OVMF
            # UEFI coverage is advisory in CI. The runner ships only
            # /usr/share/qemu/OVMF.fd, a 4MB build this QEMU will not load
            # the way the gate loads it, so a red run says nothing about the
            # kernel. Both of these are hard failures in `make verify-boot`,
            # where the local firmware works -- and the published images are
            # verified against BIOS and UEFI on KVM before release.
            VERIFY_RETRIES=0 ./tools/verify-boot.sh build/charisos-vm.iso --uefi --timeout 30 \
              || echo "::warning::UEFI boot check did not pass on this runner (firmware-dependent)"
            VERIFY_RETRIES=0 ./tools/verify-boot.sh build/charisos-usb.img --disk --uefi --timeout 30 \
              || echo "::warning::UEFI disk boot check did not pass on this runner (firmware-dependent)"
            # UEFI on KVM: the configuration GNOME Boxes and VirtualBox use,
            # and the one that stayed broken longest.
            #
            # Advisory, not gating. It is verified locally and against the
            # published release image; whether it can run here depends on which
            # OVMF the runner has. Ubuntu ships the 4MB build only as
            # /usr/share/qemu/OVMF.fd, which is not usable here, so a failure
            # here means the runner's firmware, not the kernel.
            VERIFY_RETRIES=0 ./tools/verify-boot.sh build/charisos-vm.iso --uefi --kvm --timeout 30 \
              || echo "::warning::UEFI+KVM boot check did not pass on this runner (firmware-dependent) -- see local \`make verify-boot\`"
          fi

      - name: Boot VMM huge-page and permission regression suite
        run: |
          set -e
          make images-vmm-test
          BUILD_DIR=build/vmm-test ./tools/verify-boot.sh build/vmm-test/charisos-vm.iso --require-vmm-tests

      - name: Boot kernel-stack guard IST containment test
        run: |
          set -e
          make images-stack-guard-test
          BUILD_DIR=build/stack-guard-test ./tools/verify-stack-guard.sh build/stack-guard-test/charisos-vm.iso

      - name: Capture desktop and verify persistent settings
        if: success()
        timeout-minutes: 5
        shell: bash
        run: |
          set -eu
          mkdir -p build
          # Give the guest a real writable primary-master FAT32 disk. The
          # ISO-only capture cannot prove preferences survive a reboot.
          dd if=/dev/zero of=build/config-test-disk.img bs=1M count=128 status=none
          mkfs.fat -F 32 build/config-test-disk.img >/dev/null
          # SeaBIOS capture avoids making OVMF an installation dependency.
          # The kernel's framebuffer is captured directly from the guest.
          {
            sleep 8
            for step in {1..7}; do
              printf 'sendkey ret\n'
              sleep 1
            done
            sleep 4
            printf 'screendump build/charisos-desktop-preview.ppm\n'
            sleep 2
            # Verify the Browser desktop shortcut path and capture its native
            # window before exercising the multi-window Files/Terminal path.
            printf 'sendkey f9\n'
            sleep 2
            printf 'screendump build/charisos-browser-preview.ppm\n'
            sleep 1
            printf 'sendkey esc\n'
            sleep 1
            # Open Files and Terminal simultaneously, then test Alt+Tab
            # routing. The second F5 must reach Files when Files is focused.
            printf 'sendkey f10\n'
            sleep 2
            printf 'screendump build/charisos-files-preview.ppm\n'
            sleep 1
            printf 'sendkey f5\n'
            sleep 1
            printf 'sendkey f12\n'
            sleep 2
            printf 'sendkey alt-tab\n'
            sleep 1
            printf 'sendkey f5\n'
            sleep 1
            printf 'sendkey alt-tab\n'
            sleep 1
            # Terminal is focused while Files remains open underneath.
            printf 'sendkey h\n'
            sleep 1
            printf 'sendkey e\n'
            sleep 1
            printf 'sendkey l\n'
            sleep 1
            printf 'sendkey p\n'
            sleep 1
            printf 'sendkey ret\n'
            sleep 2
            printf 'sendkey meta_l-up\n'
            sleep 3
            printf 'screendump build/charisos-maximized-preview.ppm\n'
            sleep 1
            printf 'sendkey meta_l-down\n'
            sleep 3
            printf 'screendump build/charisos-multiwindow-preview.ppm\n'
            sleep 1
            # Drive the actual PS/2 pointer to the restored Terminal resize
            # grip (initial pointer 50,50; Terminal bounds 228,188 to 868,628).
            # QEMU HMP mouse_move uses relative deltas. PS/2 Y is inverted by
            # QEMU, so positive monitor Y moves down in the framebuffer.
            # Exercise the shared bounded sizing path through accessible
            # keyboard resize mode. Alt+F8 starts; arrows adjust; Enter commits.
            # Four right + three down steps add 80x60 pixels to 640x404.
            printf 'sendkey alt-f8\n'
            sleep 1
            for step in {1..4}; do
              printf 'sendkey right\n'
              sleep 0.25
            done
            for step in {1..3}; do
              printf 'sendkey down\n'
              sleep 0.25
            done
            printf 'sendkey ret\n'
            sleep 3
            printf 'screendump build/charisos-resized-preview.ppm\n'
            sleep 1
            printf 'sendkey esc\n'
            sleep 1
            # Files receives focus again after Terminal closes.
            printf 'sendkey esc\n'
            sleep 2
            # Open Settings through its keyboard shortcut, capture it,
            # then exercise the text-size and interface-scale controls.
            printf 'sendkey f11\n'
            sleep 2
            printf 'screendump build/charisos-settings-preview.ppm\n'
            sleep 1
            printf 'sendkey f6\n'
            sleep 1
            printf 'sendkey f7\n'
            sleep 1
            printf 'screendump build/charisos-settings-adjusted-preview.ppm\n'
            sleep 1
            # Close Settings and capture the actual desktop with the saved
            # enlarged typography. This catches launcher overflow that a
            # Settings-only screenshot cannot reveal.
            printf 'sendkey esc\n'
            sleep 3
            printf 'screendump build/charisos-desktop-scaled-preview.ppm\n'
            sleep 1
            printf 'quit\n'
          } | timeout 85s qemu-system-x86_64 \
            -machine pc -m 512M -vga std -nic none -no-reboot \
            -drive file=build/config-test-disk.img,format=raw,if=ide,index=0 \
            -cdrom build/charisos-vm.iso -boot order=d \
            -serial file:build/desktop-capture-serial.log \
            -monitor stdio -display none \
            >build/desktop-capture-qemu.log 2>&1 || true

          test -s build/charisos-desktop-preview.ppm
          test -s build/charisos-browser-preview.ppm
          grep -q 'SHELL_APP_OPEN Browser' build/desktop-capture-serial.log
          test -s build/charisos-files-preview.ppm
          grep -q 'FILES_OPEN' build/desktop-capture-serial.log
          grep -Eq 'FILES_ROOT_COUNT=[1-9][0-9]*' build/desktop-capture-serial.log
          test "$(grep -c 'FILES_REFRESH' build/desktop-capture-serial.log)" -ge 2
          grep -q 'FILES_CLOSE' build/desktop-capture-serial.log
          grep -q 'TERMINAL_OPEN' build/desktop-capture-serial.log
          grep -q 'TERMINAL_CMD help' build/desktop-capture-serial.log
          grep -q 'SHELL_WINDOW_MAXIMIZED' build/desktop-capture-serial.log
          grep -q 'SHELL_WINDOW_RESTORED' build/desktop-capture-serial.log
          grep -q 'SHELL_KEYBOARD_RESIZE_STARTED 640x404' build/desktop-capture-serial.log
          grep -q 'SHELL_KEYBOARD_RESIZE_COMMITTED 720x464' build/desktop-capture-serial.log
          test -s build/charisos-maximized-preview.ppm
          test -s build/charisos-multiwindow-preview.ppm
          test -s build/charisos-resized-preview.ppm
          test -s build/charisos-settings-preview.ppm
          test -s build/charisos-settings-adjusted-preview.ppm
          test -s build/charisos-desktop-scaled-preview.ppm

          # Read the actual FAT32 file back from the disk image. The two
          # settings changes exercised above must have reached persistent media.
          mcopy -i build/config-test-disk.img ::CHARISOS.CFG build/CHARISOS.CFG
          grep -qx 'font_scale=2' build/CHARISOS.CFG
          grep -qx 'ui_scale=120' build/CHARISOS.CFG

          # Reboot against the same disk and verify the kernel reloads the
          # exact saved values, then capture Settings after that reboot.
          {
            sleep 10
            printf 'sendkey f11\n'
            sleep 2
            printf 'screendump build/charisos-settings-reloaded-preview.ppm\n'
            sleep 1
            # The persisted 200% setting has now been verified after reboot.
            # Increase once more to the largest supported font size and capture
            # the desktop without the Settings window obscuring the workspace.
            printf 'sendkey f6\n'
            sleep 2
            printf 'sendkey esc\n'
            sleep 2
            printf 'screendump build/charisos-desktop-large-font-preview.ppm\n'
            sleep 1
            printf 'quit\n'
          } | timeout 45s qemu-system-x86_64 \
            -machine pc -m 512M -vga std -nic none -no-reboot \
            -drive file=build/config-test-disk.img,format=raw,if=ide,index=0 \
            -cdrom build/charisos-vm.iso -boot order=d \
            -serial file:build/desktop-reboot-serial.log \
            -monitor stdio -display none \
            >build/desktop-reboot-qemu.log 2>&1
          grep -q 'CONFIG_LOADED .*font_scale=2 ui_scale=120' build/desktop-reboot-serial.log
          test -s build/charisos-settings-reloaded-preview.ppm
          grep -q 'CONFIG_SAVE OK .*font_scale=3 ui_scale=120' build/desktop-reboot-serial.log
          test -s build/charisos-desktop-large-font-preview.ppm

          # Open Terminal through its keyboard shortcut, then execute help.
          # This exercises the real keyboard IRQ and shell event path without
          # relying on QEMU's emulated pointer device or guessed mouse deltas.
          {
            sleep 2
            printf 'sendkey f12\n'
            sleep 2
            printf 'sendkey h\n'
            sleep 1
            sleep 1
            printf 'sendkey e\n'
            sleep 1
            printf 'sendkey l\n'
            sleep 1
            printf 'sendkey p\n'
            sleep 1
            printf 'sendkey ret\n'
            sleep 3
            printf 'screendump build/charisos-terminal-preview.ppm\n'
            sleep 1
            printf 'quit\n'
          } | timeout 35s qemu-system-x86_64 \
            -machine pc -m 512M -vga std -nic none -no-reboot \
            -drive file=build/config-test-disk.img,format=raw,if=ide,index=0 \
            -cdrom build/charisos-vm.iso -boot order=d \
            -serial file:build/terminal-capture-serial.log \
            -monitor stdio -display none \
            >build/terminal-capture-qemu.log 2>&1
          grep -q 'TERMINAL_OPEN' build/terminal-capture-serial.log
          grep -q 'TERMINAL_CMD help' build/terminal-capture-serial.log
          test -s build/charisos-terminal-preview.ppm

      - name: Upload desktop preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charisos-desktop-preview
          path: |
            build/charisos-desktop-preview.ppm
            build/charisos-browser-preview.ppm
            build/charisos-files-preview.ppm
            build/charisos-multiwindow-preview.ppm
            build/charisos-maximized-preview.ppm
            build/charisos-resized-preview.ppm
            build/charisos-settings-preview.ppm
            build/charisos-settings-adjusted-preview.ppm
            build/charisos-desktop-scaled-preview.ppm
            build/charisos-settings-reloaded-preview.ppm
            build/charisos-desktop-large-font-preview.ppm
            build/charisos-terminal-preview.ppm
            build/desktop-capture-serial.log
            build/desktop-capture-qemu.log
            build/desktop-reboot-serial.log
            build/desktop-reboot-qemu.log
            build/terminal-capture-serial.log
            build/terminal-capture-qemu.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs
          path: |
            build/verify-*.log
            build/stack-guard-test/stack-guard-qemu-serial.log
            build/stack-guard-test/stack-guard-qemu.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish ISO artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: charisos-images
          path: |
            build/charisos-vm.iso
            build/charisos-usb.img
          retention-days: 30
