name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Boot Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            nasm \
            qemu-system-x86 \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools

      - name: Build kernel
        run: make

      - name: Compile VMM self-tests
        run: make test

      - name: Inspect kernel ELF
        run: |
          file build/kernel.elf
          objdump -f build/kernel.elf | sed -n '1,6p'

      - name: Confirm ISO payload
        run: |
          test -f build/charisos.iso
          ls -la build/charisos.iso

      - name: Boot in QEMU and capture serial output
        run: |
          # -nographic routes the serial console to stdout, which is the only
          # kernel output CI can see: the VGA text console is not captured.
          timeout 45 qemu-system-x86_64 \
            -cdrom build/charisos.iso \
            -m 256M \
            -nographic \
            -no-reboot \
            2>&1 | tr -d '\r' | tee boot.log || true
          # Strip ANSI escapes so the log is greppable and readable as an artifact.
          sed -i 's/\x1b\[[0-9;?]*[A-Za-z]//g; s/\x1b[()][A-Z0-9]//g' boot.log

      - name: Verify boot reached the scheduler
        run: |
          echo "=== captured serial output ==="
          cat boot.log
          echo "==============================="

          # NOTE: assertions below deliberately match only strings the KERNEL
          # writes to the serial port. GRUB's and SeaBIOS' own screen drawing is
          # suppressed when the runner has no TTY, so grepping for bootloader
          # text (e.g. "Booting `CharisOS'") is environment-dependent and has
          # already produced a false failure here.

          # The C entry point ran.
          grep -q "Built:" boot.log \
            || { echo "::error::kernel_main never reached its banner"; exit 1; }
          echo "ok: kernel_main reached its banner"

          # THE decisive check. Emitted from kernel_main only after the
          # Multiboot2 magic validated, every init*() returned, and the shell
          # task was created. A hang anywhere in the init sequence (the
          # pci_scan infinite loop, the fs_open FAT walk, a bad magic) means
          # this line never appears.
          grep -q "\[BOOT\] init complete, entering scheduler" boot.log \
            || { echo "::error::kernel did not complete initialisation — see boot.log above"; exit 1; }
          echo "ok: init sequence completed, scheduler entered"

          # A rejected magic or a panic must never appear.
          if grep -q "Invalid Multiboot2 magic" boot.log; then
            echo "::error::Multiboot2 magic was rejected"
            exit 1
          fi
          if grep -q "KERNEL PANIC" boot.log; then
            echo "::error::kernel reported a panic"
            exit 1
          fi
          echo "ok: no boot failure or panic"

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: boot.log
          retention-days: 14

      - name: Publish ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: charisos-iso
          path: build/charisos.iso
          retention-days: 30
