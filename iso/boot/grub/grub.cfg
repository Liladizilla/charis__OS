# CharisOS boot menu
#
# The kernel needs GRUB to hand it a linear framebuffer, otherwise the
# Multiboot2 GFX tag is either absent or describes the 80x25 VGA text buffer
# (type 2 at 0xB8000) and there is nothing for the graphics driver to draw on.
# gfxterm plus an explicit gfxpayload makes GRUB switch to a graphics mode
# before loading the kernel, which is what populates the framebuffer tag.

set timeout=0
set default=0

insmod all_video
insmod gfxterm
insmod part_gpt
insmod fat

# gfxmode sets GRUB's own output mode, which is what a Multiboot2 kernel
# inherits as its framebuffer. gfxpayload alone only applies to the `linux`
# command, so without gfxmode GRUB stays in VGA text mode and the framebuffer
# tag comes back as type 2 pointing at 0xB8000.
set gfxmode=1024x768x32
set gfxpayload=1024x768x32
terminal_output gfxterm

menuentry "CharisOS" {
    echo "Loading kernel..."
    multiboot2 /boot/kernel.elf
    echo "Booting kernel..."
    boot
}
